<!DOCTYPE html>
<html style="background: black;color: white;">
<body>
<h1>HTML5 Canvas</h1>
<h2>The getImageData() Method</h2>

<img id="scream" src="img_the_scream.jpg" alt="The Scream" width="220" height="277">
<canvas id="myCanvas" width="220" height="277" style="border:1px solid grey"></canvas>

<script>
//got this code from https://www.w3schools.com/jsref/canvas_getimagedata.asp
    document.getElementById("scream").onload = function() {
    const c = document.getElementById("myCanvas");
    const ctx = c.getContext("2d");
    const img = document.getElementById("scream");
    ctx.drawImage(img, 0, 0);
    const imgData = ctx.getImageData(0, 0, c.width, c.height);
    const imgDataLen = imgData.data.length;
    const startPoint = Math.floor(Math.random() * imgDataLen);
    const endPoint = Math.floor(Math.random() * imgDataLen) + startPoint;
    const colourDestroyMode = Math.floor(Math.random() * 30) + 4;

    // invert colors
    for (
    let i = startPoint;                 // start at random place
    i < endPoint;                       // end at random point between start
    i += colourDestroyMode
    ) {
        imgData.data[i] = 255 - imgData.data[i];
        imgData.data[i+1] = 255 - imgData.data[i+1];
        imgData.data[i+2] = 255 - imgData.data[i+2];
        imgData.data[i+3] = 255;
        }
    ctx.putImageData(imgData, 0, 0);
    //console.log(imgData.data);
};
</script>

</body>
</html>
